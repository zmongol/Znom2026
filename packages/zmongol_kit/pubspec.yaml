name: zmongol_kit
description: "Shared Zmongol ecosystem kit: one account (Apple/Google sign-in, session tokens, entitlements), the shared app catalogue and cross-promotion config, and ready-made cross-promo widgets for the Zmongol app family."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
