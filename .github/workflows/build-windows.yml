name: Build Windows

on:
  push:
    branches: [pdf-page-images]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Znom-Windows-1.0.5.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Znom-Windows-1.0.5
          path: Znom-Windows-1.0.5.zip
